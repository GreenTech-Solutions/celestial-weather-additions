[mod-setting-description]
shibadisaster-cwa-enable-paracelsin-changes=Придаёт погоде Парацельсина характер вулканической зимы. Это влияет на видимость и игровой процесс, поэтому по умолчанию отключено.
shibadisaster-cwa-pelagos-enable-tropical-recolor=Тропическая окраска уже добавлена в сам Pelagos, поэтому теперь эта настройка по умолчанию отключена.
shibadisaster-cwa-panglia-enable-antilinear-fog=Добавляет туман над зонами ускоренного времени.
cwn-nauvis-rain=Постоянный дождь, как на Глебе. По умолчанию отключён: в игре без модов дождь идёт только на Глебе.
cwn-nauvis-rain-amount=На Глебе их 10.
cwn-nauvis-deepwater-fog=Низинный туман, как на Глебе, над глубокой водой в озёрах.
cwn-nauvis-water-fog=Низинный туман также появляется над мелководьем. Игра задаёт туман для типа клетки, а не планеты, поэтому он появляется и над водой других планет с таким же туманом, как на Глебе, например на Пелагосе.
cwn-nauvis-falling-leaves=Время от времени с живых деревьев опадают листья. Это происходит и на других планетах с такими же деревьями.
cwn-nauvis-pollen=Бледная пыльца поднимается от некоторых луговых растений и уносится ветром.
cwn-nauvis-golden-hours=Тёплый свет на закате и рассвете. Не применяется, если другой мод уже изменил цвета Наувиса.
cwn-nauvis-wind-gusts=Порывы ветра время от времени, как на Глебе.
